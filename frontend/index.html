<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MEROS AI — Oilaning Umrbod Raqamli Hamrohi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#0F5C8A;--blue2:#1C7BA8;--blue-l:#D8ECF4;--blue-xl:#EFF8FC;
  --gold:#C9962C;--gold-l:#FBF0D9;
  --green:#2D7A4F;--green-l:#E8F5EE;
  --rose:#C2185B;--rose-l:#FCE4EC;
  --amber:#B8750F;--amber-l:#FEF3DC;
  --red:#C0392B;--red-l:#FDECEA;
  --purple:#6D28D9;--purple-l:#EDE9FE;
  --text:#1A1A2E;--text2:#4A5568;--text3:#9AA3AF;
  --bg:#FFFFFF;--bg2:#F8F6F0;--bg3:#EEF2F7;
  --border:#E5DFC8;--border2:#CBD5E0;
  --r:14px;--r2:10px;--r3:6px;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --shadow2:0 4px 16px rgba(0,0,0,.10);
}
html,body{height:100%;background:var(--bg2)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;color:var(--text);font-size:15px;line-height:1.5}
button{cursor:pointer;border:none;background:none;font-family:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit}

.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(0,0,0,.12)}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;padding-bottom:66px}
.scrollable{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

.status-bar{background:var(--blue);color:#fff;display:flex;justify-content:center;align-items:center;padding:13px 16px;font-size:12px;font-weight:500;flex-shrink:0}
.status-bar .brand{font-size:16px;font-weight:800;letter-spacing:.3px}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:430px;max-width:100%;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 7px;color:var(--text3);font-size:10px;font-weight:600;transition:color .18s;background:none;border:none;cursor:pointer}
.nav-btn.active{color:var(--blue)}
.nav-btn i{font-size:22px;line-height:1}

.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer}
.card-row{display:flex;align-items:center;gap:12px}
.icon-box{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-title{font-size:14px;font-weight:700;color:var(--text)}
.card-sub{font-size:12px;color:var(--text2);margin-top:1px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-amber{background:var(--amber-l);color:var(--amber)}
.badge-red{background:var(--red-l);color:var(--red)}
.badge-blue{background:var(--blue-l);color:var(--blue)}
.badge-purple{background:var(--purple-l);color:var(--purple)}

.section-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;padding:14px 16px 6px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:var(--r2);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .18s,transform .1s;border:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--blue);color:#fff}
.btn-rose{background:var(--rose);color:#fff}
.btn-full{width:100%}
.btn:disabled{opacity:.5}

.input-group{margin-bottom:14px}
.input-group label{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:5px}
.input-field{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--r2);font-size:15px;color:var(--text);background:var(--bg);transition:border-color .18s;outline:none}
.input-field:focus{border-color:var(--blue)}
.input-field::placeholder{color:var(--text3)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding:20px 16px 32px;animation:slideUp .25s ease-out}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px}
.modal h2{font-size:18px;font-weight:800;margin-bottom:16px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.chat-overlay{position:fixed;inset:0;background:var(--bg);z-index:600;display:flex;flex-direction:column;max-width:430px;margin:0 auto;animation:slideUp .22s ease-out}
.chat-header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.chat-back{font-size:22px;color:var(--text);cursor:pointer;padding:2px}
.chat-title{font-size:15px;font-weight:800;flex:1}
.chat-body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg2)}
.chat-bubble{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.4;word-wrap:break-word}
.chat-bubble img,.chat-bubble video{margin:-3px -6px 4px;max-width:calc(100% + 12px)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.chat-bubble.mine{align-self:flex-end;background:var(--rose);color:#fff;border-bottom-right-radius:4px}
.chat-bubble.theirs{align-self:flex-start;background:var(--bg);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
.chat-time{font-size:10px;opacity:.65;margin-top:3px;display:block}
.chat-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.chat-input{flex:1;border:1.5px solid var(--border);border-radius:22px;padding:10px 16px;font-size:14px;outline:none;background:var(--bg2)}
.chat-input:focus{border-color:var(--rose)}
.chat-send{width:40px;height:40px;border-radius:50%;background:var(--rose);color:#fff;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0}
.chat-send:disabled{opacity:.4}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text3);text-align:center;padding:24px}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1A1A2E;color:#fff;padding:11px 20px;border-radius:100px;font-size:13px;font-weight:600;z-index:999;white-space:nowrap;animation:toastIn .25s ease-out;box-shadow:var(--shadow2)}
.toast.error{background:var(--red)}
.toast.success{background:var(--green)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* AUTH */
.auth-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:linear-gradient(160deg,#072B45 0%,#0F5C8A 55%,#1C7BA8 100%);position:relative}
.auth-screen::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:repeating-linear-gradient(45deg,var(--gold) 0 8px,transparent 8px 16px)}
.auth-logo{font-size:44px;font-weight:900;color:#fff;letter-spacing:-1px;margin-bottom:4px;text-align:center}
.auth-tagline{font-size:14px;color:rgba(255,255,255,.72);margin-bottom:36px;text-align:center}
.auth-card{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.auth-card h2{font-size:20px;font-weight:800;margin-bottom:3px}
.auth-card .sub{font-size:13px;color:var(--text2);margin-bottom:20px}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px}
.auth-tab{flex:1;padding:9px;border-radius:var(--r2);font-size:13px;font-weight:700;border:1.5px solid var(--border);color:var(--text2);background:var(--bg2);cursor:pointer;transition:all .18s}
.auth-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.demo-box{background:var(--blue-xl);border:1px solid var(--blue-l);border-radius:var(--r2);padding:10px 12px;font-size:12px;color:var(--blue);margin-top:12px;line-height:1.6}

/* HOME */
.home-hero{background:linear-gradient(135deg,#0A4567,#0F5C8A 55%,#1C7BA8);padding:20px 16px 28px;flex-shrink:0;border-bottom:3px solid var(--gold);position:relative}
.home-hero::after{content:'';position:absolute;bottom:-3px;left:0;right:0;height:3px;background:repeating-linear-gradient(45deg,var(--gold) 0 6px,transparent 6px 12px)}
.home-greeting{font-size:13px;color:rgba(255,255,255,.75);margin-bottom:3px}
.home-fam-name{font-size:22px;font-weight:800;color:#fff;margin-bottom:18px}
.fam-strip{display:flex;gap:10px;align-items:center;overflow-x:auto;padding-bottom:2px}
.fam-strip::-webkit-scrollbar{display:none}
.av-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.av{width:48px;height:48px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff}
.av-lbl{font-size:9px;color:rgba(255,255,255,.8);font-weight:500;max-width:52px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av-add{width:48px;height:48px;border-radius:50%;border:2px dashed rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}

.alert-strip{display:flex;gap:10px;align-items:flex-start;background:var(--amber-l);border-left:3px solid var(--amber);border-radius:0 var(--r2) var(--r2) 0;padding:12px 14px;margin:12px 16px 0}
.alert-strip i{color:var(--amber);font-size:19px;flex-shrink:0;margin-top:1px}
.alert-strip strong{font-size:13px;font-weight:700;color:#7A5200;display:block}
.alert-strip span{font-size:12px;color:#9A6B00}

.oila-wrap{padding:10px 16px 0}
.oila-banner{background:var(--amber-l);border:1px solid #F0C060;border-radius:var(--r2);padding:12px 14px;display:flex;gap:10px;align-items:center}
.oila-banner i{color:var(--amber);font-size:20px;flex-shrink:0}
.oila-tit{font-size:13px;font-weight:700;color:#7A5200}
.oila-sub{font-size:11px;color:#9A6B00;margin-top:1px}

.warmth-widget{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin:0 16px 10px}
.warmth-head{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px}
.warmth-head i{color:var(--rose);font-size:17px}
.em-row{display:flex;gap:8px;justify-content:center;margin-bottom:7px}
.em-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .18s;background:var(--bg2)}
.em-btn.picked{border-color:var(--blue);background:var(--blue-l);transform:scale(1.12)}
.warmth-hint{font-size:12px;color:var(--text2);text-align:center}

/* HEALTH */
.health-hero{background:linear-gradient(135deg,#1A4D30,#2D7A4F);padding:20px 16px 24px;flex-shrink:0;border-bottom:3px solid var(--gold)}
.page-h1{font-size:22px;font-weight:800;color:#fff;margin-bottom:3px}
.page-sub{font-size:13px;color:rgba(255,255,255,.75)}
.tab-row{display:flex;gap:7px;padding:12px 16px 0;overflow-x:auto}
.tab-row::-webkit-scrollbar{display:none}
.tab-item{padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text2);white-space:nowrap;flex-shrink:0;transition:all .18s}
.tab-item.active{background:var(--green);color:#fff;border-color:var(--green)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0}
.stat-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:12px}
.stat-lbl{font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:600}
.stat-val{font-size:21px;font-weight:800;color:var(--text);line-height:1}
.stat-unit{font-size:12px;color:var(--text2);margin-left:2px;font-weight:400}
.stat-trend{font-size:11px;margin-top:3px;color:var(--green)}
.vac-list{padding:0 16px}
.vac-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.vac-item:last-child{border-bottom:none}
.vdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.d-done{background:var(--green)} .d-soon{background:var(--amber)} .d-over{background:var(--red)} .d-sched{background:#CBD5E0}
.vac-info{flex:1}
.vac-name{font-size:13px;font-weight:700;color:var(--text)}
.vac-date{font-size:11px;color:var(--text3);margin-top:1px}
.vac-date.warn{color:var(--amber);font-weight:700}
.vac-date.danger{color:var(--red);font-weight:700}

/* MEMORIES */
.mem-hero{background:linear-gradient(135deg,#3B0D8F,#6D28D9);padding:20px 16px 24px;flex-shrink:0;border-bottom:3px solid var(--gold)}
.chip-row{display:flex;gap:7px;padding:12px 16px 0;overflow-x:auto}
.chip-row::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:var(--bg);border:1px solid var(--border);color:var(--text2);flex-shrink:0;transition:all .18s}
.chip.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:10px 16px 0}
.photo-cell{aspect-ratio:1;border-radius:var(--r3);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:opacity .18s}
.photo-cell:active{opacity:.8}
.cap-list{padding:0 16px}
.cap-item{display:flex;align-items:center;gap:11px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.cap-icon{width:40px;height:40px;border-radius:10px;background:var(--purple-l);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.cap-info{flex:1}
.cap-title{font-size:13px;font-weight:700;color:var(--text)}
.cap-date{font-size:11px;color:var(--purple);margin-top:1px;font-weight:600}
.cap-open{font-size:11px;color:var(--green);font-weight:800}

/* RELATIONSHIP */
.rel-hero{background:linear-gradient(135deg,#7A0933,#C2185B);padding:20px 16px 24px;flex-shrink:0;border-bottom:3px solid var(--gold)}
.score-row{display:flex;gap:8px;padding:12px 16px 0}
.score-box{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);padding:12px;text-align:center}
.score-num{font-size:28px;font-weight:900;line-height:1}
.score-lbl{font-size:11px;color:var(--text3);margin-top:3px;font-weight:600}
.bars-area{padding:0 16px}
.bars-chart{display:flex;align-items:flex-end;gap:7px;height:80px;margin-bottom:5px}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px}
.bar-fill{width:100%;border-radius:4px 4px 0 0;min-height:4px}
.bar-day{font-size:9px;color:var(--text3)}
.bar-v{font-size:10px;font-weight:700;color:var(--text2)}
.scale-form{padding:0 16px}
.scale-q{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px}
.scale-btns{display:flex;gap:5px;margin-bottom:14px}
.scale-btn{flex:1;padding:9px 0;border:1.5px solid var(--border);border-radius:var(--r3);font-size:14px;font-weight:700;color:var(--text2);background:var(--bg2);text-align:center;cursor:pointer;transition:all .18s}
.scale-btn.picked{background:var(--rose);color:#fff;border-color:var(--rose)}

/* PROFILE */
.prof-hero{background:linear-gradient(135deg,#0A3A5A,#0F5C8A);padding:24px 16px 32px;text-align:center;flex-shrink:0;border-bottom:3px solid var(--gold)}
.prof-av{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;margin:0 auto 12px}
.prof-name{font-size:19px;font-weight:800;color:#fff;margin-bottom:3px}
.prof-sub2{font-size:12px;color:rgba(255,255,255,.7)}
.menu-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);margin:0 16px 10px;overflow:hidden}
.menu-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.menu-row:last-child{border-bottom:none}
.menu-row:active{background:var(--bg2)}
.menu-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-text{flex:1;font-size:14px;font-weight:600;color:var(--text)}
.int-row{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--border)}
.int-row:last-child{border-bottom:none}
.int-ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.int-name{font-size:13px;font-weight:700;color:var(--text)}
.int-st{font-size:11px;color:var(--text3);margin-top:1px}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--border2);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--blue)}
.toggle::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:20px}

.spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:14px;background:linear-gradient(160deg,#0D3B7A,#1A56A0)}
.loading-wrap .logo{font-size:48px;font-weight:900;color:#fff}
.loading-wrap p{color:rgba(255,255,255,.7);font-size:14px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;gap:10px}
.empty i{font-size:44px;color:var(--text3)}
.empty p{font-size:13px;color:var(--text2)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback,useRef,createContext,useContext}=React;
const Ctx=createContext(null);
function useApp(){return useContext(Ctx)}

/* TRANSLATIONS */
const LANGS=['uz','ru','en'];
const LANG_LABELS={uz:"O'zbekcha",ru:'Русский',en:'English'};
const I18N={
  uz:{
    nav_home:'Bosh',nav_health:"Sog'liq",nav_memories:'Xotira',nav_relationship:'Biz',nav_profile:'Profil',
    greeting_morning:'Xayrli tong',greeting_day:'Xayrli kun',greeting_evening:'Xayrli kech',greeting_night:'Xayrli tun',
    today_stats:"Bugungi ko'rsatkichlar",quick_actions:'Tezkor harakatlar',members:"A'zolar",memories:'Xotiralar',relationship:'Munosabat',
    health_archive:"Sog'liq arxivi",health_sub:'Oila tibbiy tarixi va emlash jadvali',
    memories_archive:'Xotiralar arxivi',memories_sub_suffix:'ta xotira · 20 yillik tarix',
    relationship_title:'Munosabat',relationship_sub:'Oila mustahkamligi kuzatuvi',
    profile_title:'Profil',logout:'Chiqish',
    family_time:'Oila vaqti',oila_sub:"Farzandingiz siz bilan o'ynashni kutmoqda",
    warmth_today:"Bugungi issiqlik o'lchovi",pick_score:'Ballni tanlang (1-5)',saved:'saqlandi',

function getLang(){return localStorage.getItem('meros_lang')||'uz'}
function t(key){
  const lang=getLang();
  return (I18N[lang]&&I18N[lang][key])||I18N.uz[key]||key;
}

const API=window.location.origin+'/api';
function api(path,opts={}){
  const tok=localStorage.getItem('meros_token');
  return fetch(API+path,{
    headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},
    ...opts,body:opts.body?JSON.stringify(opts.body):undefined
  }).then(r=>r.json()).catch(()=>({ok:false,error:'Server bilan aloqa yo\'q'}));
}

function getInitials(s=''){return s.trim().split(' ').map(p=>p[0]||'').join('').slice(0,2).toUpperCase()||'MA'}
function getGreeting(){
  const h=new Date().getHours();
  if(h>=5&&h<11)return t('greeting_morning');
  if(h>=11&&h<17)return t('greeting_day');
  if(h>=17&&h<22)return t('greeting_evening');
  return t('greeting_night');
}

/* TOAST */
function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t)},[]);
  return React.createElement('div',{className:`toast ${type||''}`},msg);
}

      React.createElement('h2',null,title),

}

function AuthScreen(){
  const {setToken,showToast,lang,changeLang}=useApp();

  const [phone,setPhone]=useState('');
  const [name,setName]=useState('');
  const [pw,setPw]=useState('');
  const [gender,setGender]=useState('male');
  const [birthDate,setBirthDate]=useState('');
  const [inviteCode,setInviteCode]=useState('');
  const [loading,setLoading]=useState(false);

  async function submit(e){
    e.preventDefault();
    if(!phone||!pw)return showToast('Telefon va parol kiriting','error');
    if(tab==='register'&&!birthDate)return showToast(t('birth_date_required'),'error');
    setLoading(true);
    const body=tab==='login'
      ?{phone,password:pw}
      :{phone,full_name:name,password:pw,gender,birth_date:birthDate,invite_code:inviteCode.trim()};
    const r=await api(tab==='login'?'/auth/login':'/auth/register',{method:'POST',body});

function getAgeGroup(birthDate){
  if(!birthDate)return '3-7';
  const age=new Date().getFullYear()-parseInt(birthDate);
  if(age<=3)return '0-3';
  if(age<=7)return '3-7';
  if(age<=12)return '7-12';
  return '12-18';
}

function getWeekNumber(){
  const now=new Date();
  const start=new Date(now.getFullYear(),0,1);
  return Math.floor((now-start)/(7*24*60*60*1000));
}

function ChatAudioRecorder({onCancel,onSend}){
  const {showToast}=useApp();
  const [recording,setRecording]=useState(false);
  const [seconds,setSeconds]=useState(0);
  const [audioData,setAudioData]=useState(null);
  const mrRef=useRef(null);const chunksRef=useRef([]);const timerRef=useRef(null);

  useEffect(()=>{ startRecording(); return ()=>{ if(timerRef.current)clearInterval(timerRef.current); }; },[]);

  async function startRecording(){
    if(!navigator.mediaDevices?.getUserMedia)return showToast(t('mic_not_supported'),'error');
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunksRef.current=[];
      const mr=new MediaRecorder(stream);
      mrRef.current=mr;
      mr.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data);};
      mr.onstop=async()=>{
        stream.getTracks().forEach(tr=>tr.stop());
        const blob=new Blob(chunksRef.current,{type:'audio/webm'});
        if(blob.size>MEDIA_RAW_LIMITS.audio){showToast(t('audio_too_long'),'error');onCancel();return;}
        const b64=await fileToBase64(blob);
        setAudioData(b64);
      };
      mr.start();
      setRecording(true);
      timerRef.current=setInterval(()=>setSeconds(s=>{
        if(s>=60){stopRecording();return s;}
        return s+1;
      }),1000);
    }catch(e){ showToast(t('mic_permission_denied'),'error'); onCancel(); }
  }
  function stopRecording(){
    if(mrRef.current&&mrRef.current.state!=='inactive')mrRef.current.stop();
    if(timerRef.current)clearInterval(timerRef.current);
    setRecording(false);
  }

  return React.createElement('div',{style:{padding:'14px',borderTop:'1px solid var(--border)',background:'var(--bg2)',display:'flex',alignItems:'center',gap:12}},
    !audioData?React.createElement(React.Fragment,null,
      React.createElement('div',{style:{width:10,height:10,borderRadius:'50%',background:'var(--red)',animation:recording?'pulse 1s infinite':'none'}}),
      React.createElement('div',{style:{flex:1,fontSize:14,fontWeight:700}},`0:${seconds.toString().padStart(2,'0')}`),
      React.createElement('button',{onClick:()=>{stopRecording();onCancel();},style:{background:'none',border:'none',color:'var(--text3)',fontSize:20,cursor:'pointer'}},React.createElement('i',{className:'ti ti-x'})),
      React.createElement('button',{onClick:stopRecording,style:{background:'var(--red)',color:'#fff',border:'none',borderRadius:'50%',width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}},React.createElement('i',{className:'ti ti-player-stop-filled',style:{fontSize:16}}))
    ):React.createElement(React.Fragment,null,
      React.createElement('audio',{src:audioData,controls:true,style:{flex:1}}),
      React.createElement('button',{onClick:onCancel,style:{background:'none',border:'none',color:'var(--text3)',fontSize:20,cursor:'pointer'}},React.createElement('i',{className:'ti ti-trash'})),
      React.createElement('button',{onClick:()=>onSend(audioData),style:{background:'var(--rose)',color:'#fff',border:'none',borderRadius:'50%',width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}},React.createElement('i',{className:'ti ti-send',style:{fontSize:16}}))
    )
  );
}

function ChatModal({onClose,channel,title}){
  const {showToast}=useApp();
  const [messages,setMessages]=useState(null);
  const [text,setText]=useState('');
  const [sending,setSending]=useState(false);
  const [attachPreview,setAttachPreview]=useState(null); // {kind,data}
  const [showRecorder,setShowRecorder]=useState(false);
  const bodyRef=useRef(null);
  const fileRef=useRef(null);
  const myId=localStorage.getItem('meros_user_id');

  function loadMessages(scrollToBottom){
    api('/messages?channel='+channel).then(r=>{
      if(r.ok){
        setMessages(r.data);
        if(scrollToBottom)setTimeout(()=>{
          if(bodyRef.current)bodyRef.current.scrollTop=bodyRef.current.scrollHeight;
        },50);
      }
    });
  }

  useEffect(()=>{
    loadMessages(true);
    const iv=setInterval(()=>loadMessages(false),8000);
    return()=>clearInterval(iv);
  },[channel]);

  async function send(){
    if(attachPreview){
      setSending(true);
      const r=await api('/messages',{method:'POST',body:{kind:attachPreview.kind,media_url:attachPreview.data,body:text.trim(),channel}});
      setSending(false);
      if(!r.ok){showToast(r.error,'error');return;}
      setAttachPreview(null);setText('');
      loadMessages(true);
      return;
    }
    const body=text.trim();
    if(!body||sending)return;
    setSending(true);
    setText('');
    const r=await api('/messages',{method:'POST',body:{body,kind:'text',channel}});
    setSending(false);
    if(!r.ok){showToast(r.error,'error');setText(body);return;}
    loadMessages(true);
  }

  function handleKey(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
  }

  async function pickPhoto(){ fileRef.current?.click(); }
  async function handleFile(e){
    const file=e.target.files?.[0];
    if(!file)return;
    if(file.type.startsWith('image/')){
      try{ const d=await resizeImage(file,1000,0.7); setAttachPreview({kind:'photo',data:d}); }
      catch(err){ showToast(t('image_upload_error'),'error'); }
    } else if(file.type.startsWith('video/')){
      if(file.size>MEDIA_RAW_LIMITS.video)return showToast(t('video_too_large'),'error');
      try{ const d=await fileToBase64(file); setAttachPreview({kind:'video',data:d}); }
      catch(err){ showToast(t('video_upload_error'),'error'); }
    } else {
      showToast(t('only_images'),'error');
    }
    e.target.value='';
  }

  function formatTime(iso){
    try{
      const d=new Date(iso+(iso.includes('Z')?'':'Z'));
      return d.toLocaleTimeString(getLang()==='ru'?'ru-RU':getLang()==='en'?'en-US':'uz-UZ',{hour:'2-digit',minute:'2-digit'});
    }catch(e){return '';}
  }

  function renderBubbleContent(m){
    if(m.kind==='photo'&&m.media_url)return React.createElement('img',{src:m.media_url,style:{maxWidth:200,borderRadius:10,display:'block'}});
    if(m.kind==='video'&&m.media_url)return React.createElement('video',{src:m.media_url,controls:true,style:{maxWidth:200,borderRadius:10,display:'block',background:'#000'}});
    if(m.kind==='audio'&&m.media_url)return React.createElement('audio',{src:m.media_url,controls:true,style:{maxWidth:220}});
    return m.body;
  }

  return React.createElement('div',{className:'chat-overlay'},
    React.createElement('div',{className:'chat-header'},

function CompatTestModal({onClose}){
  const {showToast}=useApp();
  const [blocks,setBlocks]=useState(null);
  const [labels,setLabels]=useState({});
  const [step,setStep]=useState(0); // 0 = intro, 1..5 = blocks, 6 = result
  const [answers,setAnswers]=useState({});
  const [partnerName,setPartnerName]=useState('');
  const [result,setResult]=useState(null);
  const [submitting,setSubmitting]=useState(false);

  useEffect(()=>{
    api('/compatibility/questions?lang='+getLang()).then(r=>{if(r.ok){setBlocks(r.data.blocks);setLabels(r.data.labels);}});
  },[]);

  const blockKeys=blocks?Object.keys(blocks):[];
  const totalSteps=blockKeys.length;
  const currentBlockKey=step>=1&&step<=totalSteps?blockKeys[step-1]:null;
  const currentQuestions=currentBlockKey?blocks[currentBlockKey]:[];

  function pick(qid,val){
    setAnswers(a=>({...a,[qid]:val}));
  }

  function blockComplete(){
    if(!currentQuestions.length)return false;
    return currentQuestions.every(q=>answers[q.id]!=null);
  }

  async function finish(){
    setSubmitting(true);
    const r=await api('/compatibility/submit',{method:'POST',body:{answers,partner_name:partnerName,lang:getLang()}});
    setSubmitting(false);
    if(!r.ok)return showToast(r.error,'error');
    setResult(r.data);
    setStep(totalSteps+1);
  }

  function next(){
    if(step===totalSteps){finish();return;}
    setStep(s=>s+1);
  }

  // INTRO
  if(step===0){
    return React.createElement(Modal,{title:t('compat_test_title'),onClose},
      React.createElement('div',{style:{textAlign:'center',marginBottom:16}},
        React.createElement('div',{style:{fontSize:40,marginBottom:10}},'💞'),
        React.createElement('div',{style:{fontSize:14,color:'var(--text2)',lineHeight:1.6}},t('compat_test_intro'))
      ),
      React.createElement('div',{className:'input-group'},
        React.createElement('label',null,t('partner_name_lbl')),
        React.createElement('input',{className:'input-field',placeholder:t('partner_name_placeholder'),value:partnerName,onChange:e=>setPartnerName(e.target.value)})
      ),
      React.createElement('div',{className:'menu-card',style:{margin:'14px 0'}},
        blockKeys.map(k=>React.createElement('div',{key:k,className:'menu-row',style:{cursor:'default'}},
          React.createElement('div',{className:'menu-icon',style:{background:'var(--rose-l)'}},React.createElement('i',{className:'ti ti-circle-check',style:{color:'var(--rose)',fontSize:16}})),
          React.createElement('div',{className:'menu-text'},labels[k]||k)
        ))
      ),
      React.createElement('button',{className:'btn btn-full',style:{background:'var(--rose)',color:'#fff'},onClick:()=>setStep(1),disabled:!blocks},
        blocks?t('start_test'):React.createElement('span',{className:'spinner'})
      ),
      React.createElement('div',{style:{fontSize:11,color:'var(--text3)',textAlign:'center',marginTop:10}},t('compat_test_privacy'))
    );
  }

  // RESULT
  if(step===totalSteps+1&&result){
    const scoreColor=result.overall_score>=75?'var(--green)':result.overall_score>=55?'var(--amber)':'var(--rose)';
    return React.createElement(Modal,{title:t('compat_result_title'),onClose},
      React.createElement('div',{style:{textAlign:'center',marginBottom:18}},
        React.createElement('div',{style:{width:90,height:90,borderRadius:'50%',background:scoreColor+'22',border:`4px solid ${scoreColor}`,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px'}},
          React.createElement('span',{style:{fontSize:26,fontWeight:900,color:scoreColor}},result.overall_score+'%')
        ),
        React.createElement('div',{style:{fontSize:15,fontWeight:700,color:'var(--text)'}},
          result.overall_score>=75?t('compat_high'):result.overall_score>=55?t('compat_mid'):t('compat_low')
        )
      ),
      React.createElement('div',{className:'section-label',style:{padding:'0 0 8px'}},t('compat_by_block')),
      React.createElement('div',{className:'menu-card',style:{margin:'0 0 16px'}},
        Object.entries(result.block_scores).map(([k,v])=>React.createElement('div',{key:k,className:'menu-row',style:{cursor:'default'}},
          React.createElement('div',{style:{flex:1}},
            React.createElement('div',{className:'menu-text'},result.labels?.[k]||k),
            React.createElement('div',{style:{height:6,background:'var(--bg3)',borderRadius:3,marginTop:6,overflow:'hidden'}},
              React.createElement('div',{style:{height:'100%',width:v+'%',background:v>=75?'var(--green)':v>=55?'var(--amber)':'var(--rose)',borderRadius:3}})
            )
          ),
          React.createElement('div',{style:{fontSize:13,fontWeight:800,color:'var(--text)',marginLeft:10}},v+'%')
        ))
      ),
      React.createElement('div',{style:{background:'var(--blue-xl)',border:'1px solid var(--blue-l)',borderRadius:'var(--r2)',padding:'12px 14px',fontSize:12,color:'var(--blue)',textAlign:'center',fontWeight:600,lineHeight:1.6,marginBottom:14}},
        t('compat_disclaimer')
      ),
      React.createElement('button',{className:'btn btn-full',style:{background:'var(--rose)',color:'#fff'},onClick:onClose},t('done'))
    );
  }

  // QUESTION STEP
  return React.createElement(Modal,{title:`${labels[currentBlockKey]||''} (${step}/${totalSteps})`,onClose},
    React.createElement('div',{style:{display:'flex',gap:4,marginBottom:18}},
      blockKeys.map((k,i)=>React.createElement('div',{key:k,style:{flex:1,height:4,borderRadius:2,background:i<step?'var(--rose)':'var(--border)'}}))
    ),
    currentQuestions.map(q=>React.createElement('div',{key:q.id,style:{marginBottom:18}},
      React.createElement('div',{style:{fontSize:14,fontWeight:600,color:'var(--text)',marginBottom:10,lineHeight:1.5}},q.text),
      React.createElement('div',{style:{display:'flex',gap:5}},
        [1,2,3,4,5].map(n=>React.createElement('div',{key:n,
          onClick:()=>pick(q.id,n),
          style:{flex:1,padding:'10px 0',borderRadius:8,textAlign:'center',cursor:'pointer',fontWeight:700,fontSize:14,
            border:answers[q.id]===n?'2px solid var(--rose)':'1.5px solid var(--border)',
            background:answers[q.id]===n?'var(--rose-l)':'var(--bg2)',

        React.createElement('span',null,t('scale_agree'))

    React.createElement('button',{className:'btn btn-full',style:{background:'var(--rose)',color:'#fff'},onClick:next,disabled:!blockComplete()||submitting},
      submitting?React.createElement('span',{className:'spinner'}):(step===totalSteps?t('see_result'):t('next_step'))
    )
  );
}

function speakText(text, lang, onStart, onEnd){
  if(!('speechSynthesis' in window)){
    return false;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const langMap = {uz:'tr-TR', ru:'ru-RU', en:'en-US'}; // uz fallback to tr (closer phonetics) since uz voices are rare
  utter.lang = langMap[lang] || 'en-US';
  utter.rate = 0.85;
  utter.pitch = 1.15;
  utter.onstart = onStart;
  utter.onend = onEnd;
  utter.onerror = onEnd;
  window.speechSynthesis.speak(utter);
  return true;
}

function VoiceRecorderSection(){
  const {showToast}=useApp();
  const [recording,setRecording]=useState(false);
  const [audioUrl,setAudioUrl]=useState(null);
  const [seconds,setSeconds]=useState(0);
  const [permissionDenied,setPermissionDenied]=useState(false);
  const mediaRecorderRef=useRef(null);
  const chunksRef=useRef([]);
  const timerRef=useRef(null);
  const streamRef=useRef(null);

  useEffect(()=>{
    return ()=>{
      if(timerRef.current)clearInterval(timerRef.current);
      if(streamRef.current)streamRef.current.getTracks().forEach(tr=>tr.stop());
      if(audioUrl)URL.revokeObjectURL(audioUrl);
    };
  },[]);

  async function startRecording(){
    if(!navigator.mediaDevices?.getUserMedia){
      showToast(t('mic_not_supported'),'error');
      return;
    }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      streamRef.current=stream;
      chunksRef.current=[];
      const mr=new MediaRecorder(stream);
      mediaRecorderRef.current=mr;
      mr.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data);};
      mr.onstop=()=>{
        const blob=new Blob(chunksRef.current,{type:'audio/webm'});
        const url=URL.createObjectURL(blob);
        setAudioUrl(url);
        stream.getTracks().forEach(tr=>tr.stop());
      };
      mr.start();
      setRecording(true);
      setSeconds(0);
      timerRef.current=setInterval(()=>setSeconds(s=>{
        if(s>=180){stopRecording();return s;} // max 3 minutes
        return s+1;
      }),1000);
    }catch(e){
      setPermissionDenied(true);
      showToast(t('mic_permission_denied'),'error');
    }
  }

  function stopRecording(){
    if(mediaRecorderRef.current&&mediaRecorderRef.current.state!=='inactive'){
      mediaRecorderRef.current.stop();
    }
    if(timerRef.current)clearInterval(timerRef.current);
    setRecording(false);
  }

  function deleteRecording(){
    if(audioUrl)URL.revokeObjectURL(audioUrl);
    setAudioUrl(null);
    setSeconds(0);
  }

  function formatTime(s){
    const m=Math.floor(s/60);
    const sec=s%60;
    return `${m}:${sec.toString().padStart(2,'0')}`;
  }

  return React.createElement('div',null,
    React.createElement('div',{style:{fontSize:13,color:'var(--text2)',marginBottom:16,textAlign:'center',lineHeight:1.6}},
      t('voice_record_intro')
    ),
    !audioUrl&&React.createElement('div',{style:{textAlign:'center',padding:'20px 0'}},
      React.createElement('button',{
        onClick:recording?stopRecording:startRecording,
        style:{width:84,height:84,borderRadius:'50%',border:'none',cursor:'pointer',

function resizeImage(file, maxDim=900, quality=0.75){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>height&&width>maxDim){height=height*maxDim/width;width=maxDim;}
        else if(height>maxDim){width=width*maxDim/height;height=maxDim;}
        const canvas=document.createElement('canvas');
        canvas.width=width;canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

const MEDIA_RAW_LIMITS={video:6_000_000,audio:3_000_000}; // raw byte limits before base64 overhead

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>resolve(e.target.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

  const [mediaData,setMediaData]=useState(null);

  const fileRef=useRef(null);
  const emojis=['📷','🎂','🏖️','🌸','👶','🎓','🏡','❤️','🌿','🎠','✈️','🎉'];
  const colors={'📷':'#DBEAFE','🎂':'#DCF5E7','🏖️':'#FEF3DC','🌸':'#FDE7F0','👶':'#EDE9FE','🎓':'#FDECEA','🏡':'#E1F5EE','❤️':'#FEE2E2','🌿':'#ECFDF5','🎠':'#F5F3FF','✈️':'#E0F2FE','🎉':'#FEF9C3'};

  // voice recording state (for audio tab)
  const [recording,setRecording]=useState(false);
  const [recSeconds,setRecSeconds]=useState(0);
  const mrRef=useRef(null);const chunksRef=useRef([]);const timerRef=useRef(null);const streamRef=useRef(null);

  function switchTab(tab){
    setMediaTab(tab);
    setMediaData(null);

  async function handleFile(e){
    const file=e.target.files?.[0];
    if(!file)return;
    if(mediaTab==='photo'){
      if(!file.type.startsWith('image/'))return showToast(t('only_images'),'error');
      setResizing(true);
      try{ setMediaData(await resizeImage(file)); }
      catch(err){ showToast(t('image_upload_error'),'error'); }
      setResizing(false);
    } else if(mediaTab==='video'){
      if(!file.type.startsWith('video/'))return showToast(t('only_videos'),'error');
      if(file.size>MEDIA_RAW_LIMITS.video)return showToast(t('video_too_large'),'error');
      setResizing(true);
      try{ setMediaData(await fileToBase64(file)); }
      catch(err){ showToast(t('video_upload_error'),'error'); }
      setResizing(false);
    }
  }

  async function startAudioRecording(){
    if(!navigator.mediaDevices?.getUserMedia)return showToast(t('mic_not_supported'),'error');
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      streamRef.current=stream;
      chunksRef.current=[];
      const mr=new MediaRecorder(stream);
      mrRef.current=mr;
      mr.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data);};
      mr.onstop=async()=>{
        const blob=new Blob(chunksRef.current,{type:'audio/webm'});
        stream.getTracks().forEach(tr=>tr.stop());
        if(blob.size>MEDIA_RAW_LIMITS.audio){showToast(t('audio_too_long'),'error');return;}
        const b64=await fileToBase64(blob);
        setMediaData(b64);

        if(s>=60){stopAudioRecording();return s;}
        return s+1;

  }

function PinLockScreen({onUnlock,onLogout,getPinKey}){
  const {showToast}=useApp();
  const [entered,setEntered]=useState('');
  const [shake,setShake]=useState(false);
  const [attempts,setAttempts]=useState(0);

  function press(digit){
    if(entered.length>=4)return;
    const next=entered+digit;
    setEntered(next);
    if(next.length===4){
      setTimeout(()=>checkPin(next),150);
    }
  }
  function backspace(){ setEntered(e=>e.slice(0,-1)); }

  function checkPin(pin){
    const key=getPinKey();

    if(entered.length>=4)return;

    if(next.length===4)setTimeout(()=>handleComplete(next),150);

  function backspace(){ setEntered(e=>e.slice(0,-1)); }

function App(){
  const [token,setToken]=useState(localStorage.getItem('meros_token'));
  const [page,setPage]=useState('home');
  const [toast,setToast]=useState(null);
  const [modal,setModal]=useState(null);

  const [famCache,setFamCache]=useState(null);
  const [lang,setLang]=useState(getLang());
  const [pinUnlocked,setPinUnlocked]=useState(false);
  const [pinSetupNeeded,setPinSetupNeeded]=useState(false);
  const [showAlerts,setShowAlerts]=useState(false);
  const [alertsUnread,setAlertsUnread]=useState(0);

  function getPinKey(){
    const uid=localStorage.getItem('meros_user_id');
    return uid?`meros_pin_${uid}`:null;
  }
  function hasPinSet(){
    const key=getPinKey();
    return key?!!localStorage.getItem(key):false;
  }

  useEffect(()=>{
    if(!token)return;
    if(hasPinSet()){
      setPinUnlocked(false);
      setPinSetupNeeded(false);
    } else {
      setPinUnlocked(true); // no PIN configured yet for this account — let them in, then prompt setup once
      setPinSetupNeeded(true);
    }
  },[token]);

  useEffect(()=>{
    if(!token||!pinUnlocked)return;
    api('/alerts').then(r=>{if(r.ok)setAlertsUnread(r.data.unread)});
  },[token,pinUnlocked,refresh,showAlerts]);

  function showToast(msg,type=''){setToast({msg,type,key:Date.now()})}
  function showModal(modalType){
    const baseType=modalType.split(':')[0];
    if(['profileDetail','familyTree','documents','lullaby','memberProfile'].includes(baseType)&&!famCache){
      api('/family').then(r=>{if(r.ok)setFamCache(r.data)});
    }
    setModal(modalType);
  }
  function closeModal(){setModal(null)}
  function logout(){
    localStorage.removeItem('meros_token');
    localStorage.removeItem('meros_user_id');
    localStorage.removeItem('meros_is_minor');
    setToken(null);setPage('home');setPinUnlocked(false);
  }
  function onDone(){setRefresh(r=>r+1)}
  function changeLang(l){localStorage.setItem('meros_lang',l);setLang(l);setRefresh(r=>r+1)}
  function savePin(pin){
    const key=getPinKey();
    if(key)localStorage.setItem(key,pin);
    setPinSetupNeeded(false);
  }
  function skipPinSetup(){ setPinSetupNeeded(false); }

  const ctx={showToast,showModal,logout,setToken,lang,changeLang};

  if(!token)return React.createElement(Ctx.Provider,{value:ctx},
    React.createElement(AuthScreen),
    toast&&React.createElement(Toast,{key:toast.key,...toast,onDone:()=>setToast(null)})
  );

  if(!pinUnlocked){
    return React.createElement(Ctx.Provider,{value:ctx},
      React.createElement(PinLockScreen,{
        onUnlock:()=>setPinUnlocked(true),
        onLogout:logout,
        getPinKey
      }),
      toast&&React.createElement(Toast,{key:toast.key,...toast,onDone:()=>setToast(null)})

  const isMinor=localStorage.getItem('meros_is_minor')==='1';

  const modals={
    member:()=>React.createElement(AddMemberModal,{onClose:closeModal,onDone}),
    memory:()=>React.createElement(AddMemoryModal,{onClose:closeModal,onDone,albumId:modalArg||null}),
    capsule:()=>React.createElement(AddCapsuleModal,{onClose:closeModal,onDone}),
    profileDetail:()=>React.createElement(ProfileDetailModal,{onClose:closeModal,fam:famCache,me:famCache?.me,onUpdated:()=>{
      api('/family').then(r=>{if(r.ok)setFamCache(r.data)});
      onDone();
    }}),
    familyTree:()=>React.createElement(FamilyTreeModal,{onClose:closeModal,fam:famCache}),
    documents:()=>React.createElement(DocumentsModal,{onClose:closeModal,fam:famCache}),
    lullaby:()=>React.createElement(LullabyModal,{onClose:closeModal,members:famCache?.members}),
    createAlbum:()=>React.createElement(CreateAlbumModal,{onClose:closeModal,onDone}),
    memberProfile:()=>React.createElement(MemberProfileModal,{onClose:closeModal,
      member:famCache?.members?.find(m=>m.id===modalArg),
      onUpdated:()=>{api('/family').then(r=>{if(r.ok)setFamCache(r.data)});onDone();}
    }),
  };

  return React.createElement(Ctx.Provider,{value:ctx},
    React.createElement('div',{className:'app'},
      React.createElement('div',{className:'status-bar',style:{position:'relative'}},
        React.createElement('span',{className:'brand'},
          React.createElement('span',{style:{color:'var(--gold)'}},'❋'),' MEROS AI'
        ),
        React.createElement('button',{onClick:()=>setShowAlerts(true),
          style:{position:'absolute',right:14,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',padding:6}},
          React.createElement('i',{className:'ti ti-bell',style:{color:'#fff',fontSize:20}}),
          alertsUnread>0&&React.createElement('span',{style:{position:'absolute',top:2,right:2,width:8,height:8,borderRadius:'50%',background:'var(--amber)',border:'1.5px solid var(--blue)'}})
        )
      ),
      (pages[page]||pages.home)(),
      React.createElement('nav',{className:'bottom-nav'},
        nav.map(x=>React.createElement('button',{key:x.k,className:`nav-btn${page===x.k?' active':''}`,onClick:()=>setPage(x.k)},
          React.createElement('i',{className:`ti ${x.ic}`}),React.createElement('span',null,x.lbl)
        ))
      )
    ),
    toast&&React.createElement(Toast,{key:toast.key,...toast,onDone:()=>setToast(null)}),
    modal&&(modals[modalKey]?modals[modalKey]():null),
    pinSetupNeeded&&React.createElement(PinSetupModal,{onDone:savePin,onSkip:skipPinSetup}),
    showAlerts&&React.createElement(AlertsCenterModal,{onClose:()=>setShowAlerts(false)})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
